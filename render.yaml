services:
  - type: web
    name: nayumi-web-gateway
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: python web_bridge.py
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BRIDGE_SECRET
        value: nayumi_secret_bridge_2026
